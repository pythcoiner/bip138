[package]
name = "bip138"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "BIP138 Compact encryption scheme for Non-seed wallet data"
license = "MIT"
repository = "https://github.com/pythcoiner/bip138"
documentation = "https://docs.rs/bip138"
include = ["Cargo.toml", "LICENSE", "README.md", "src/**/*.rs"]
publish = true

[lib]
path = "src/lib.rs"

[workspace]
members = ["bip138-ll"]
exclude = ["fuzz", "examples"]

[dependencies]
# Dependency-free wire format and crypto core. The `rust-bitcoin` provider is
# always on so `EncryptedBackup` has SHA-256 and ChaCha20-Poly1305 to hand; the
# `rand` feature below adds the OS entropy source for nonces.
bip138-ll = { version = "0.1.0", path = "bip138-ll", default-features = false, features = ["rust-bitcoin"] }
base64 = {version = "0.22", default-features = false, features = ["alloc"], optional = true}

# Old format (BEB magic, AES-256-GCM): used solely on the decrypt path
# as a transparent fallback for backups produced by 0.0.2.
bitcoin-encrypted-backup-v0 = { version = "0.0.2", package = "bitcoin-encrypted-backup", default-features = false, optional = true }

#miniscript
mscript_12 = { version = "12.0", default-features = false, features = ["serde", "no-std"], package = "miniscript" , optional = true}
mscript_13 = { version = "13", package = "miniscript", default-features = false, features = ["serde"], optional = true }

# devices
bwk-hwi = { version = "0.1.0", default-features = false, features = ["bitbox", "coldcard", "jade", "ledger", "specter"], optional = true }

# descriptor_backup (std-only document parsing)
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.145", optional = true }

# cli
clap = { version = "=4.5.42", features = ["derive"] , optional = true}

[dev-dependencies]
hex = "0.4.3"
rand = {version = "0.9.2"}
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[[bin]]
name = "bip138"
path = "src/bin/main.rs"
required-features = ["cli"]

[features]
default = ["miniscript_latest", "rand", "base64", "v0", "descriptor_backup"]
rand = ["bip138-ll/os-rng"]
base64 = ["dep:base64"]
v0 = ["dep:bitcoin-encrypted-backup-v0"]
miniscript_latest = ["miniscript_12"]
miniscript_12 = ["mscript_12", "bitcoin-encrypted-backup-v0?/miniscript_12_0"]
miniscript_13 = ["mscript_13"]
devices = ["dep:bwk-hwi"]
descriptor_backup = ["dep:serde", "dep:serde_json"]
# no backend forced, so the bin builds on any of them
cli = ["dep:clap", "rand", "descriptor_backup"]
